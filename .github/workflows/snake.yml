name: Generate Futuristic Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: vaishnavireddy0
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-dark
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Add neon glow effect
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os

          for file in Path("dist").glob("*.svg"):
              os.chmod(file, 0o644)
              svg = file.read_text()

              svg = svg.replace(
                  "--cs:purple",
                  "--cs:#a855f7"
              )

              glow = """
              .s { filter: url(#neonGlow); }
              """
              defs = """
              <defs>
                <filter id="neonGlow" x="-100%" y="-100%" width="300%" height="300%">
                  <feGaussianBlur stdDeviation="3" result="blur"/>
                  <feFlood flood-color="#a855f7" result="color"/>
                  <feComposite in="color" in2="blur" operator="in" result="glow"/>
                  <feMerge>
                    <feMergeNode in="glow"/>
                    <feMergeNode in="SourceGraphic"/>
                  </feMerge>
                </filter>
              </defs>
              """

              if "</style>" in svg and 'id="neonGlow"' not in svg:
                  svg = svg.replace("</style>", glow + "</style>", 1)
                  svg = svg.replace("<style>", defs + "<style>", 1)

              file.write_text(svg)
              print(f"Updated {file}")
          PY

      - name: Publish animation
        uses: peaceiris/actions-gh-pages@v4
        with:
          publish_branch: output
          publish_dir: dist
          github_token: ${{ secrets.GITHUB_TOKEN }}
